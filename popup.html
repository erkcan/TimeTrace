<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeTrace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e11;
      --surface: #18181d;
      --border: #2a2a35;
      --accent: #c8f135;
      --accent-dim: #8faa25;
      --text: #f0f0f0;
      --muted: #6b6b7e;
      --danger: #ff5c5c;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 0;
      overflow: hidden;
    }

    .header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--accent);
    }

    .logo span { color: var(--muted); }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-dot.active { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .status-dot.idle { background: var(--danger); }

    .current-site {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .current-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .current-domain {
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-domain.none { color: var(--muted); font-size: 12px; }

    .today-total {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
    }

    .total-value {
      font-size: 22px;
      font-weight: 500;
      font-family: 'Syne', sans-serif;
      color: var(--text);
    }

    .section-title {
      padding: 10px 18px 6px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
    }

    .domain-list {
      padding: 0 12px;
      max-height: 200px;
      overflow-y: auto;
    }

    .domain-list::-webkit-scrollbar { width: 3px; }
    .domain-list::-webkit-scrollbar-track { background: transparent; }
    .domain-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .domain-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 6px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .domain-row:hover { background: var(--surface); }

    .domain-rank {
      font-size: 9px;
      color: var(--muted);
      width: 14px;
      text-align: right;
      flex-shrink: 0;
    }

    .domain-bar-wrap {
      flex: 1;
      min-width: 0;
    }

    .domain-name {
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .bar-track {
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .domain-time {
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
      text-align: right;
      min-width: 50px;
    }

    .empty {
      padding: 20px 18px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      line-height: 1.6;
    }

    .footer {
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    .dashboard-link {
      font-size: 10px;
      color: var(--accent-dim);
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      letter-spacing: 0.5px;
      transition: color 0.15s;
    }

    .dashboard-link:hover { color: var(--accent); }

    .limit-section {
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      display: none;
    }
    .limit-section.visible { display: block; }
    .limit-section-title {
      font-size: 9px; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--muted); margin-bottom: 8px;
    }
    .limit-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .limit-row label { font-size: 10px; color: var(--muted); width: 110px; flex-shrink: 0; }
    .limit-row input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px;
      padding: 4px 8px; border-radius: 4px;
    }
    .limit-row input:focus { outline: none; border-color: var(--accent); }
    .limit-status {
      font-size: 10px; margin-bottom: 8px; padding: 4px 8px;
      border-radius: 4px; background: var(--surface);
    }
    .limit-status.set { color: var(--accent); }
    .limit-status.exceeded { color: var(--danger); }
    .popup-btn {
      width: 100%; background: var(--accent); color: #0e0e11;
      border: none; font-family: 'DM Mono', monospace; font-size: 10px;
      font-weight: 500; padding: 7px; border-radius: 5px; cursor: pointer;
      letter-spacing: 0.5px; transition: opacity 0.15s;
    }
    .popup-btn:hover { opacity: 0.85; }
    .popup-btn.remove { background: none; border: 1px solid var(--border); color: var(--muted); margin-top: 5px; }
    .popup-btn.remove:hover { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Time<span>Trace</span></div>
    <div class="status-pill">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">loading</span>
    </div>
  </div>

  <div class="current-site">
    <div class="current-label">Now tracking</div>
    <div class="current-domain none" id="currentDomain">—</div>
  </div>

  <div class="today-total">
    <div class="total-label">Today's total</div>
    <div class="total-value" id="todayTotal">—</div>
  </div>

  <div class="section-title">Top sites today</div>
  <div class="domain-list" id="domainList">
    <div class="empty">No data yet.<br>Start browsing to see stats.</div>
  </div>


  <div class="limit-section" id="limitSection">
    <div class="limit-section-title">Daily limit for this site</div>
    <div class="limit-status" id="limitStatus"></div>
    <div class="limit-row">
      <label>Limit (minutes)</label>
      <input type="number" id="limitInput" min="1" placeholder="e.g. 45">
    </div>
    <div class="limit-row">
      <label>Snooze (minutes)</label>
      <input type="number" id="snoozeInput" min="1" placeholder="e.g. 15" value="15">
    </div>
    <button class="popup-btn" id="saveLimitBtn">Save limit</button>
    <button class="popup-btn remove" id="removeLimitBtn" style="display:none">Remove limit</button>
  </div>

  <div class="footer">
    <button class="dashboard-link" id="openDashboard">Open full dashboard →</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
